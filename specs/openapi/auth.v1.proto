syntax = "proto3";
package easymusic.user.v1;

message User {
  string id = 1;
  string email = 2;
  string display_name = 3;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
}