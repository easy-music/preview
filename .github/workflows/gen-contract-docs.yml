name: Gen contract docs
on:
  pull_request:
    branches:
      - main

      
jobs:
  gen-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install widdershins
        run: npm install -g widdershins
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install protoc
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install jinja2
      - name: Run generators
        run: |
          chmod +x scripts/gen_openapi_md.sh
          chmod +x scripts/gen_proto_md.sh
          ./scripts/gen_openapi_md.sh
          ./scripts/gen_proto_md.sh || true
      - name: Show generated files
        run: ls -R docs || true
      - name: Commit generated docs (to PR branch)
        run: |
          git config user.email "ci@easymusic"
          git config user.name "easymusic-ci"
          git add docs || true
          git commit -m "Auto-generate API docs from specs" || echo "no changes"
          git push || echo "push failed"
